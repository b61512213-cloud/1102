    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#fbbf24',
                            green: '#25D366',
                            dark: '#0a0a0a',
                            card: '#161616',
                            border: '#2f2f2f'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],

    <style>
        /* إعدادات أمان مدمجة لثبات التصميم حتى عند انقطاع الـ CDN أو التصفح دون إنترنت */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            direction: rtl;
            scroll-behavior: smooth;
        }
        
        /* حماية عرض وتناسق الشبكة لبطاقات المنيو */
        #products-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            padding: 10px 0;
        }
        
        @media (max-width: 640px) {
            #products-list {
                grid-template-columns: 1fr;
            }
        }

        .card-glow {
            background-color: #161616;
            border: 1px solid #2f2f2f;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-glow:hover {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
            border-color: #fbbf24;
            transform: translateY(-4px);
        }

        /* حماية أحجام الصور من التمدد العشوائي على الهواتف */
        .card-glow img {
            width: 110px !important;
            height: 110px !important;
            max-width: 110px !important;
            max-height: 110px !important;
            object-fit: cover !important;
            border-radius: 12px !important;
            flex-shrink: 0 !important;
        }

        /* إخفاء شريط التمرير للفئات مع الحفاظ على التمرير باللمس للأجهزة الذكية */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* تصميم زر القسم النشط */
        .category-btn.active {
            background-color: #fbbf24 !important;
            color: #0a0a0a !important;
            box-shadow: 0 4px 14px rgba(251, 191, 36, 0.4);
            transform: scale(1.05);
        }
        
        /* حركة سلاسة ظهور النافذة المنبثقة للإضافات */
        #optionsModal {
            transition: opacity 0.25s ease-out;
        }
        #modalContainer {
            transition: transform 0.25s ease-out;
        }
    </style>
</head>

            <!-- أزرار الأقسام لتصفح سريع وسهل -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categories-container">
                <button onclick="selectCategory('all')" id="cat-all" class="category-btn active px-4 py-2 bg-neutral-900 text-neutral-300 border border-neutral-800 font-bold rounded-xl text-xs md:text-sm whitespace-nowrap transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-utensils"></i> الكل
                </button>
                <button onclick="selectCategory('pizza_pastries')" id="cat-pizza_pastries" class="category-btn px-4 py-2 bg-neutral-900 text-neutral-300 border border-neutral-800 font-bold rounded-xl text-xs md:text-sm whitespace-nowrap transition-all flex items-center gap-1.5">
                    🍕 بيتزا ومعجنات
                </button>
                <button onclick="selectCategory('burgers')" id="cat-burgers" class="category-btn px-4 py-2 bg-neutral-900 text-neutral-300 border border-neutral-800 font-bold rounded-xl text-xs md:text-sm whitespace-nowrap transition-all flex items-center gap-1.5">
                    🍔 بركر وزنكر
                </button>
                <button onclick="selectCategory('kentucky_strips')" id="cat-kentucky_strips" class="category-btn px-4 py-2 bg-neutral-900 text-neutral-300 border border-neutral-800 font-bold rounded-xl text-xs md:text-sm whitespace-nowrap transition-all flex items-center gap-1.5">
                    🍗 كنتاكي وستربس

                <span>أرسل الطلب عبر واتساب</span>
            </button>
        </div>
    </div>

    <script>
        let cart = {};
        let currentCategory = 'all';
        let showCartDetail = false;

        // متغيرات للتحكم بالمنتج المختار لتعديل إضافاته بالنافذة المنبثقة
        let selectedItemName = '';
        let selectedItemBasePrice = 0;

        // دالة ذكية استثنائية لمعالجة أخطاء تحميل الصور تلقائياً وحل مشكلة جيت هاب والشرطة السفلية
        function handleImageError(imageElement) {
            // لمنع الدخول في حلقة لا نهائية عند تكرار الفشل لكلا الاسمين
            if (imageElement.dataset.triedFallback === "true") {
                showPlaceholder(imageElement);
                return;
            }

            const originalSrc = imageElement.getAttribute('src');
            if (!originalSrc) {
                showPlaceholder(imageElement);
                return;
            }

            let fallbackSrc = '';
            
            // إذا كان الاسم يبدأ بشرطة سفلية وفشل، سنحاول تحميله بدونها
            if (originalSrc.startsWith('_')) {
                fallbackSrc = originalSrc.substring(1);
            } else {
                // إذا كان الاسم لا يبدأ بشرطة سفلية وفشل، نجرب وضع شرطة سفلية في البداية
                // مع مراعاة إذا كان هناك مسار كامل أو مجرد اسم ملف مباشر
                const parts = originalSrc.split('/');
                const filename = parts.pop();
                parts.push('_' + filename);
                fallbackSrc = parts.join('/');
            }

            // تفعيل فحص المحاولة الثانية
            imageElement.dataset.triedFallback = "true";
            imageElement.src = fallbackSrc;
        }

        // دالة لعرض أيقونة "أضف صورة" أنيقة في حال فشل جميع محاولات تحميل الصورة
        function showPlaceholder(imageElement) {
            const container = imageElement.parentElement;
            if (container) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-neutral-600 p-2 text-center h-full w-full bg-neutral-900 border border-neutral-800 rounded-xl" style="height: 110px; width: 110px; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-camera text-2xl mb-1.5 text-neutral-700"></i>
                        <span class="text-[10px] font-bold text-neutral-500 tracking-wider">أضف صورة</span>
                    </div>
                `;
            }
        }

        // دالة عرض وتحديث قائمة الأطعمة وفقاً للتصنيف والبحث الحالي
        function renderMenu() {
            const listContainer = document.getElementById('products-list');
            listContainer.innerHTML = '';

            const searchQuery = document.getElementById('s').value.trim().toLowerCase();

            // فلترة الوجبات حسب التصنيف المختار أو نص البحث المكتوب
            const filteredItems = menuItems.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            // في حال عدم وجود نتائج للبحث
            if (filteredItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-neutral-500 w-full" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-pizza-slice text-4xl mb-3 block text-brand-gold"></i>
                        <span class="text-sm">لم نجد أي وجبة تطابق بحثك، جرب البحث بكلمة أخرى!</span>
                    </div>
                `;
                return;
            }

            // توليد بطاقات الطعام وعرضها في المنيو
            filteredItems.forEach(item => {
                // احتساب الكمية الكلية لهذه الوجبة مع كل الإضافات المختلفة المتاحة في السلة
                let qtyInCart = 0;
                for (let cartKey in cart) {
                    if (cartKey === item.name || cartKey.startsWith(item.name + ' +')) {
                        qtyInCart += cart[cartKey].qty;
                    }
                }
                
                const cardHTML = `
                    <div class="card-glow bg-brand-card border border-brand-border rounded-2xl p-4 flex gap-4 items-center justify-between transition-all" data-name="${item.name}">
                        <!-- تفاصيل الوجبة وأزرار التحكم -->
                        <div class="flex-1 min-w-0 pr-1">
                            <h3 class="name text-lg md:text-xl font-bold text-white truncate" style="margin: 0;">${item.name}</h3>
                            <p class="calories text-neutral-400 text-xs mt-1 font-semibold flex items-center gap-1" style="margin: 4px 0 0 0;">
                                <span>🔥</span> ${item.calories}
                            </p>
                            <div class="price text-brand-gold text-lg font-extrabold mt-2" style="font-weight: 900; color: #fbbf24; font-size: 1.125rem;">${item.price.toLocaleString()} د.ع</div>
                            
                            <!-- التحكم بالوجبات وتحديث الكمية -->
                            <div class="mt-3 action-area">
                                ${qtyInCart > 0 ? `
                                    <div class="flex items-center gap-2.5 bg-neutral-900 border border-neutral-800 rounded-xl p-1.5 w-fit" style="display: flex; gap: 10px; background-color: #111; padding: 6px; border-radius: 12px; width: max-content;">
                                        <button onclick="decreaseBaseQty('${item.name}')" class="w-8 h-8 rounded-lg bg-neutral-800 text-red-500 font-extrabold text-lg flex items-center justify-center hover:bg-neutral-700 transition-colors" style="width: 32px; height: 32px; border: none; cursor: pointer;">-</button>
                                        <span class="font-black text-base min-w-[20px] text-center" style="color: white; line-height: 32px; font-weight: 800;">${qtyInCart}</span>
                                        <button onclick="orderItem('${item.name}', ${item.price})" class="w-8 h-8 rounded-lg bg-neutral-800 text-brand-gold font-extrabold text-lg flex items-center justify-center hover:bg-neutral-700 transition-colors" style="width: 32px; height: 32px; border: none; cursor: pointer; color: #fbbf24;">+</button>
                                    </div>
                                ` : `
                                    <button onclick="orderItem('${item.name}', ${item.price})" class="px-4 py-2 bg-brand-green hover:bg-emerald-600 text-neutral-950 font-black rounded-xl text-xs md:text-sm flex items-center gap-1.5 transition-colors shadow-sm" style="background-color: #25D366; color: #000; font-weight: 900; padding: 8px 16px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                        <i class="fa-solid fa-plus text-xs"></i> اطلب الآن
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- صورة الوجبة المطابقة والحقيقية مع حماية ضد الخطأ لضمان التحميل من كلا المسميين -->
                        <div class="relative w-28 h-28 md:w-32 md:h-32 flex-shrink-0 bg-neutral-900/40 rounded-xl overflow-hidden border border-neutral-850" style="width: 110px; height: 110px; flex-shrink: 0;">
                            <img src="${item.image}" 
                                 alt="${item.name}" 
                                 class="w-full h-full object-cover rounded-xl"
                                 onerror="handleImageError(this)">
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // دالة تغيير الفئات والأقسام النشطة
        function selectCategory(category) {
            currentCategory = category;
            
            // إزالة الحالة النشطة عن كافة الأزرار
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-brand-gold', 'text-neutral-950', 'active');
                btn.classList.add('bg-neutral-900', 'text-neutral-300', 'border-neutral-800');
            });

            // تفعيل الزر المختار حالياً
            const activeBtn = document.getElementById(`cat-${category}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-neutral-900', 'text-neutral-300', 'border-neutral-800');
                activeBtn.classList.add('bg-brand-gold', 'text-neutral-950', 'active');
                
                // تمرير ناعم ومريح للشريط في الأجهزة اللمسية لتمركزه
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            renderMenu();
        }

        // تصفية عند تفعيل البحث الفوري
        function filterProducts() {
            renderMenu();
        }

        // دالة فتح نافذة خيارات الإضافات للأكلة المحددة
        function orderItem(name, price) {
            selectedItemName = name;
            selectedItemBasePrice = price;
            
            // تحديث محتويات النافذة المنبثقة بالبيانات الأساسية
            document.getElementById('modalItemName').innerText = name;
            document.getElementById('modalItemPrice').innerText = `السعر الأساسي: ${price.toLocaleString()} د.ع`;
            
            // إعادة ضبط الخيارات والتشيك بوكسز
            document.getElementById('opt-cheese').checked = false;
            document.getElementById('opt-jalapeno').checked = false;
            document.getElementById('opt-fries').checked = false;
            document.getElementById('opt-extra-jalapeno').checked = false;
            
            calculateModalTotal();
            
            // إظهار المودال بحركات سلاسة ممتازة
            const modal = document.getElementById('optionsModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        // دالة حساب السعر الكلي الفوري داخل المودال بناء على الإضافات المحددة
        function calculateModalTotal() {
            let total = selectedItemBasePrice;
            if (document.getElementById('opt-cheese').checked) total += 1000;
            if (document.getElementById('opt-jalapeno').checked) total += 500;
            if (document.getElementById('opt-fries').checked) total += 1000;
            if (document.getElementById('opt-extra-jalapeno').checked) total += 500;
            
            document.getElementById('modalTotalPrice').innerText = total.toLocaleString() + ' د.ع';
        }

        // إغلاق نافذة الخيارات المنبثقة
        function closeOptionsModal() {
            const modal = document.getElementById('optionsModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-100');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // إضافة الأكلة بعد تعديل خياراتها وتخصيصها في السلة
        function addModalItemToCart() {
            let finalPrice = selectedItemBasePrice;
            let selectedOpts = [];
            
            if (document.getElementById('opt-cheese').checked) {
                finalPrice += 1000;
                selectedOpts.push('🧀 جبن');
            }
            if (document.getElementById('opt-jalapeno').checked) {
                finalPrice += 500;
                selectedOpts.push('🌶️ هالبينو');
            }
            if (document.getElementById('opt-fries').checked) {
                finalPrice += 1000;
                selectedOpts.push('🍟 فنكر قدح');
            }
            if (document.getElementById('opt-extra-jalapeno').checked) {
                finalPrice += 500;
                selectedOpts.push('🔥 زيادة هالبينو');
            }
            
            // تكوين اسم مفتاح مخصص فريد بناء على الإضافات المحددة
            let customKey = selectedItemName;
            if (selectedOpts.length > 0) {
                customKey += ' + ' + selectedOpts.join(' + ');
            }
            
            if (!cart[customKey]) {
                cart[customKey] = { 
                    baseName: selectedItemName, 
                    price: finalPrice, 
                    qty: 1 
                };
            } else {
                cart[customKey].qty += 1;
            }
            
            closeOptionsModal();
            renderMenu();
            updateCartBar();
        }

        // تقليل الكمية للوجبات المشتراة
        function decreaseBaseQty(baseName) {
            // البحث عن أول مفتاح يطابق أو يبدأ بالوجبة الأساسية وتقليل كميتها
            for (let key in cart) {
                if (key === baseName || key.startsWith(baseName + ' +')) {
                    cart[key].qty -= 1;
                    if (cart[key].qty <= 0) {
                        delete cart[key];
                    }
                    break;
                }
            }
            renderMenu();
            updateCartBar();
        }

        // تغيير كمية الوجبة المخصصة بالاسم الدقيق والكامل من السلة مباشرة
        function changeQty(name, amount) {
            if (cart[name]) {
                cart[name].qty += amount;
                if (cart[name].qty <= 0) {
                    delete cart[name];
                }
            }
            renderMenu();
            updateCartBar();
        }

        // فتح أو إغلاق تفاصيل الفاتورة السريعة في السلة
        function toggleCartDetails() {
            const detailsDiv = document.getElementById('cart-details');
            showCartDetail = !showCartDetail;
            if (showCartDetail) {
                detailsDiv.classList.remove('hidden');
            } else {
                detailsDiv.classList.add('hidden');
            }
        }

        // تحديث وإظهار شريط المشتريات السفلي وحساب الفاتورة
        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            const cartTotal = document.getElementById('cartTotal');
            const cartCount = document.getElementById('cartCount');
            const cartItemsList = document.getElementById('cart-items-list');
            
            let total = 0;
            let count = 0;
            let itemsHTML = '';
            
            for (let key in cart) {
                const itemTotal = cart[key].price * cart[key].qty;
                total += itemTotal;
                count += cart[key].qty;
                
                itemsHTML += `
                    <div class="flex justify-between items-center py-1.5 border-b border-neutral-800/40" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0;">
                        <div class="flex items-center gap-1.5" style="display: flex; gap: 6px;">
                            <span class="text-brand-gold font-black" style="color: #fbbf24; font-weight: 900;">[x${cart[key].qty}]</span>
                            <span class="text-neutral-200 font-semibold text-xs md:text-sm">${key}</span>
                        </div>
                        <div class="flex items-center gap-3" style="display: flex; gap: 12px; align-items: center;">
                            <span class="text-neutral-400 text-xs">${itemTotal.toLocaleString()} د.ع</span>
                            <div class="flex gap-1" style="display: flex; gap: 4px;">
                                <button onclick="changeQty('${key}', -1)" class="w-5 h-5 bg-neutral-800 text-red-500 rounded flex items-center justify-center hover:bg-neutral-700 font-bold" style="width: 22px; height: 22px; border: none; cursor: pointer;">-</button>
                                <button onclick="changeQty('${key}', 1)" class="w-5 h-5 bg-neutral-800 text-brand-gold rounded flex items-center justify-center hover:bg-neutral-700 font-bold" style="width: 22px; height: 22px; border: none; cursor: pointer; color: #fbbf24;">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            cartTotal.innerText = total.toLocaleString();
            cartCount.innerText = 'عدد المواد: ' + count;
            cartItemsList.innerHTML = itemsHTML || '<div class="text-neutral-500 text-xs text-center py-2">لم تختر أي وجبة بعد</div>';
            
            // إظهار الشريط أو إخفاؤه حسب وجود الأطعمة بالسلة
            if (count > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
                document.getElementById('cart-details').classList.add('hidden');
                showCartDetail = false;
            }
        }

        // إرسال الطلبات المنسقة مباشرة إلى رقم الهاتف بالواتساب
        function sendCartToWhatsApp() {
            let total = 0;
            let msg = `*السلام عليكم ورحمة الله وبركاته* 🌟\n\n`;
            msg += `أرغب بطلب هذه الوجبات من *مطعم 110*:\n`;
            msg += `━━━━━━━━━━━━━━━━━\n`;
            
            for (let key in cart) {
                let itemTotal = cart[key].price * cart[key].qty;
                total += itemTotal;
                msg += `🔹 *${key}*\n   العدد: *${cart[key].qty}* ◀ السعر: _${itemTotal.toLocaleString()} د.ع_\n`;
            }
            
            msg += `━━━━━━━━━━━━━━━━━\n`;
            msg += `💰 *المجموع الكلي:* *${total.toLocaleString()} د.ع*\n\n`;
            msg += `يرجى تأكيد وتجهيز الطلب في أسرع وقت. شكراً لكم! 🙏🌹`;
            
            const whatsappNumber = "9647715170081";
            window.open('https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(msg), '_blank');
        }

        // تشغيل القائمة فور تحميل الصفحة بالكامل
        window.onload = function() {
            renderMenu();
        }
    </script>
</body>
